name: Deploy Multi-Tier Application

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t yogitadeshmukh/multi-tier-backend:latest \
            ./backend

      # 4. Push image to Docker Hub
      - name: Push Docker image
        run: |
          docker push yogitadeshmukh/multi-tier-backend:latest

      # 5. Deploy to EC2
      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |

          echo "$EC2_SSH_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem

          ssh -o StrictHostKeyChecking=no \
            -i ec2_key.pem \
            $EC2_USERNAME@$EC2_HOST << 'EOF'

            set -e

            cd ~/multi-tier-webapp

            echo "Pulling latest code..."
            git pull origin main

            echo "Pulling latest Docker image..."
            docker pull yogitadeshmukh/multi-tier-backend:latest

            echo "Updating frontend..."
            sudo cp frontend/index.html /var/www/html/index.html

            echo "Starting application..."
            docker compose up -d

            echo "Checking containers..."
            docker ps

            echo "Waiting for backend to become ready..."

            for i in {1..12}; do
              if curl -fsS http://localhost:5001/health; then
                echo
                echo "Backend is ready!"
                break
              fi

              echo "Backend not ready yet... attempt $i/12"
              sleep 5

              if [ "$i" -eq 12 ]; then
                echo "Backend failed to become ready"
                docker ps
                docker logs multi-tier-backend --tail 100
                exit 1
              fi
            done

            echo "Testing users API..."
            curl -f http://localhost:5001/users

            echo "Testing application through Nginx..."
            curl -f http://localhost/api/health

            echo "Deployment successful!"

          EOF

          rm -f ec2_key.pem
